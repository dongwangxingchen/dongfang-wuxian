name: Smoke build (empty debug)

# v1.9.0 重写（问题表单#6）：旧工作流是 v1.7.x 时代的发布链（JDK17/平台36/1MiB 校验/
# LanzouPlus 品牌签名发布），对 35MB、AGP 9.4、Gradle 9.6、东方无限品牌的现状完全过期，
# 误触发会以错误产物走发布链。现改为纯编译冒烟：验证任意 commit 可编译，不签名不发布。
# 正式发版仍为本地构建 + GitHub Releases 手动发布（见 AGENTS.md 发版惯例）。

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit/ref to smoke build
        required: false
        default: test
        type: string
  push:
    branches: [test, main]

concurrency:
  group: smoke-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Assemble empty debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (platform 37)
        uses: android-actions/setup-android@v4

      - name: Assemble (empty debug)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          # 显式补可执行位：gradlew 在 git 里的模式曾经是 100644（无可执行位），
          # 检出后直接 `./gradlew: Permission denied`（exit 126）——
          # 这就是 CI 长期全红的真凶之一。索引里的模式已修正，这里再兜一层。
          chmod +x gradlew
          ./gradlew :app:assembleEmptyDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-empty-debug
          path: app/build/outputs/apk/empty/debug/*.apk
          retention-days: 7
