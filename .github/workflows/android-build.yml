# 东方无限 · 云端构建验证工作流（workflow_dispatch 手动触发，无任何自动执行）
# 目的：验证 GitHub Actions 能出 release 包（-Pdfwx.unsigned 跳过签名，keystore 不上云）。
# 正式对用户分发的签名包仍走本地构建；此工作流只做工具链验证与后续容量补充。
name: android-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Build unsigned release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmptyRelease -Pdfwx.unsigned --stacktrace
      - name: Assert arm64 ABI (release red line)
        run: |
          APK=$(ls app/build/outputs/apk/empty/release/*.apk | head -1)
          SDK_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "native-code: 'arm64-v8a'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dongfang-wuxian-unsigned-apk
          path: app/build/outputs/apk/empty/release/*.apk
          if-no-files-found: error
