<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>东方无限 · 控制台</title>
<style>
:root{
  /* [2026-10-03 视觉重置] 在原有骨架上做了三件事，不新增任何功能入口：
     ① 底色再压深一档、面阶梯拉开（bg < card < card2），层次靠"面差"而不是靠描边；
     ② 主色统一到与 App 一致的那支紫（#7C6DF2 系），并把渐变做成 token 便于统一调整；
     ③ 补上圆角/阴影/动效三组 token，避免各处各写一个值（原来圆角就有 9/10/11/12/14 五种）。 */
  --bg:#0b0c10; --card:#14161c; --card2:#1c1f27; --line:#282c36;
  --text:#f2f4f8; --muted:#8b93a3; --accent:#7c6df2; --accent2:#6a5ae0;
  --ok:#3ddc97; --warn:#ffb020; --danger:#ff5c5c;
  --r:14px;
  /* 新增 token：面阶梯 / 圆角三档 / 阴影两档 / 渐变。 */
  --surface:#14161c; --surface-hi:#1c1f27; --stroke:#282c36;
  --r-sm:10px; --r-md:14px; --r-lg:18px;
  --sh-1:0 1px 2px rgba(0,0,0,.32);
  --sh-2:0 8px 24px -8px rgba(0,0,0,.55);
  --grad:linear-gradient(180deg,var(--accent),var(--accent2));
  --focus:0 0 0 3px rgba(124,109,242,.20);
  /* [2026-10-03] 补齐三个**一直被引用、却从没定义**的变量。
     这是一个真 bug，不是风格问题：CSS 的 `var()` 在「变量未定义 + 没写回退值」时，
     **整条声明会被丢弃**（不是回退成 inherit），所以它坏得很安静。
     实测影响 4 处：
       · `.btn-ghost` / `.mchip` 的 `color:var(--fg)` → 失效 → 文字回落成浏览器默认黑，
         在深色底上几乎看不见（观感就是「后台有按钮是空的 / 没做完」）；
       · 两处 `<select>` 行内的 `background:var(--surface2)`
         与 `border:1px solid var(--border)` → 全失效 → 下拉框变成**白底无边框**，
         在深色页面里视觉完全断裂。
     三个值都直接取本文件已有的面/描边阶梯，不引入任何新颜色。 */
  --fg:var(--text); --surface2:var(--card2); --border:var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 88px}
h1{font-size:21px;margin:0 0 6px;font-weight:660;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
/* 卡片：面差 + 极淡阴影做出层次（原来只有 1px 描边，整页看起来是"平"的）。 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;
  margin-bottom:14px;box-shadow:var(--sh-1)}
.card h2{font-size:16px;margin:0 0 4px;font-weight:630;display:flex;align-items:center;gap:8px;letter-spacing:.1px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.55}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 6px;font-weight:500}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--text);padding:11px 13px;font-size:15px;font-family:inherit;outline:none;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
input:hover,textarea:hover,select:hover{border-color:#333846}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:var(--focus)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
button{font-family:inherit;font-size:15px;font-weight:570;border:none;border-radius:var(--r-sm);
  padding:12px 18px;cursor:pointer;transition:transform .12s ease,opacity .18s ease,background .18s ease,box-shadow .18s ease}
button:active{transform:scale(.975)}
button:disabled{opacity:.62;cursor:default}
.btn-main{background:var(--grad);color:#fff;width:100%;box-shadow:0 4px 14px -6px rgba(124,109,242,.75)}
.btn-main:hover:not(:disabled){filter:brightness(1.06)}
.btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn-sec:hover:not(:disabled){border-color:#3a4050}
.btn-danger{background:rgba(255,92,92,.14);color:var(--danger);border:1px solid rgba(255,92,92,.3)}
.btn-danger:hover:not(:disabled){background:rgba(255,92,92,.2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin:10px 0;
  transition:border-color .18s ease}
.switch:hover{border-color:#333846}
.switch .t{font-size:14.5px;font-weight:520}
.switch .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.tg{position:relative;width:50px;height:29px;flex:0 0 50px;border-radius:99px;
  background:#333846;transition:background .22s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(21px)}
.note{font-size:12.5px;color:var(--muted);background:var(--card2);border-left:3px solid var(--accent);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 13px;margin:12px 0;line-height:1.6}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:6px 0 14px}
.mbar b{font-size:14.5px;font-weight:620}
.btn-ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .18s ease,background .18s ease}
.btn-ghost:hover{border-color:var(--accent);background:var(--card2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 0 16px}
.mchip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;
  font-size:13px;cursor:pointer;text-align:left;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:border-color .18s ease,background .18s ease,opacity .18s ease}
.mchip:hover{border-color:var(--accent);background:var(--card2)}
.mchip.on{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 1px var(--accent) inset}
.mchip.off{opacity:.55;border-style:dashed}
.item{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px;
  transition:border-color .18s ease}
.item:hover{border-color:#333846}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .name{font-weight:620;font-size:14.5px;letter-spacing:.1px}
.item .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 0}
/* [2026-10-03] 顶部状态条：把"线上现在是什么状态"提到第一屏。
   只用项目已有的语义色（ok 绿 / accent 紫 / muted 灰），不引入新色。 */
.statusbar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill.on{color:var(--text);border-color:#333846}
.pill.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px}
.hd{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  background:#252932;border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(61,220,151,.5)}
.toast.err{border-color:rgba(255,92,92,.5)}
.hide{display:none!important}
/* Tab 栏：活性指示从"整块换底色"改成**下划线 + 提亮**（更轻，也更像成熟的工具后台）。
   横向滚动保留（5 个标签在窄屏仍然放不下）。 */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--sh-1)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:84px;text-align:center;padding:10px 8px;border-radius:var(--r-sm);font-size:13.5px;
  color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;
  transition:background .18s ease,color .18s ease;position:relative}
.tab:hover{color:var(--text);background:var(--card2)}
.tab.active{background:var(--card2);color:var(--text);font-weight:620;box-shadow:inset 0 -2px 0 var(--accent)}
.login{max-width:380px;margin:12vh auto 0}
.login h1{text-align:center;font-size:22px}
.login .sub{text-align:center}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:520px){.wrap{padding:16px 12px 70px}h1{font-size:18px}
  .card{padding:15px;border-radius:var(--r-sm)}
  .row>*{min-width:0}
  .item .top{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const API = "/pb/api/collections";
const AUTH = "/pb/api/collections/_superusers/auth-with-password";
/**
 * [DFW-109 2026-10-02] **用户名别名。**
 *
 * 用户反馈原话：「他当时让我填的时候，只让我填了密码，可没有问我什么用户名，所以我很纳闷。」
 *
 * 根因：登录框的「管理员邮箱」是**写死在 HTML 里预填好的**（value="<管理员账号>"），
 * 用户只看到一个密码框，压根不知道还有个用户名 —— 这是个设计缺陷，不是用户记错。
 *
 * 现在：用户名框**留空**、标签写清楚，用户填「东方」即可。
 * PocketBase 的 _superusers 底层要求邮箱格式，所以这里做一层映射，用户不用记邮箱。
 */
const USER_ALIAS = { "\u4e1c\u65b9": "<管理员账号>" };
function resolveIdentity(u){
  const key = String(u == null ? "" : u).trim();
  return USER_ALIAS[key] || key;
}
let token = localStorage.getItem("dfwx_token") || "";
/**
 * 管理员身份与口令，**只放在内存里**（不写 localStorage）：
 * 上传安装包走 nginx 的 basic auth，用的是同一套后台口令，省得再记一个。
 * 刷新页面后会丢，届时上传会提示重新输入。
 */
let adminUser = "<管理员账号>", adminPass = "";
let tab = "总控";
let cache = { control:null, release:null, notice:[], changelog:[],
  // [DFW-106] 发布历史。单独一个集合，**绝不混进 release**（理由见 renderRelease 上方的注释）。
  history:[], histPage:1, histTotal:0, histPages:1, histMissing:false, histError:"" };
let pending = {};

/* ---------- 小工具 ---------- */
const $ = (s, r=document) => r.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, kind){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast" + (kind ? " " + kind : ""); }, 2600);
}
async function api(path, opts={}){
  const o = Object.assign({}, opts);
  o.headers = Object.assign({ "Content-Type":"application/json" }, o.headers || {});
  if (token) o.headers["Authorization"] = token;
  const r = await fetch(API + path, o);
  if (r.status === 401 || r.status === 403) { logout(); throw new Error("登录已过期，请重新登录"); }
  if (!r.ok) {
    let m = "操作失败（" + r.status + "）";
    try { const j = await r.json(); if (j && j.message) m = j.message; } catch(e){}
    const err = new Error(m);
    // [DFW-106] 把状态码带出来：发布历史集合不存在时要靠 404 区分「集合还没建」和「真的没数据」。
    err.status = r.status;
    throw err;
  }
  if (r.status === 204) return null;
  return r.json();
}
async function auth(pass, user){
  const r = await fetch(AUTH, { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ identity:resolveIdentity(user), password:pass }) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.message || "邮箱或密码不正确");
  return j.token;
}
function logout(){ token=""; localStorage.removeItem("dfwx_token"); boot(); }

/* ---------- 登录 ---------- */
function renderLogin(){
  $("#app").innerHTML = `
  <div class="login">
    <h1>东方无限 · 控制台</h1>
    <p class="sub">登录后即可发布公告、修改版本与维护状态</p>
    <div class="card">
      <label for="u">用户名</label>
      <input id="u" type="text" placeholder="请输入用户名" autocomplete="username">
      <label for="p">密码</label>
      <input id="p" type="password" placeholder="请输入密码" autocomplete="current-password">
      <div style="height:16px"></div>
      <button class="btn-main" id="go">登 录</button>
      <div class="note">密码存在你自己服务器上，不在这段网页里。</div>
    </div>
  </div>`;
  const submit = async () => {
    const b = $("#go");
    const u = $("#u").value.trim(), p = $("#p").value;
    if (!u) { toast("请输入用户名", "err"); return; }
    if (!p) { toast("请输入密码", "err"); return; }
    b.disabled = true; b.innerHTML = '<span class="spin"></span> 登录中…';
    try {
      token = await auth(p, u);
      adminUser = resolveIdentity(u); adminPass = p;   // 上传安装包要复用真实身份，不是别名
      localStorage.setItem("dfwx_token", token);
      toast("登录成功", "ok");
      await boot();
    } catch(e){
      toast(e.message, "err");
      b.disabled = false; b.textContent = "登 录";
    }
  };
  $("#go").onclick = submit;
  $("#p").onkeydown = e => { if (e.key === "Enter") submit(); };
  $("#p").focus();
}

/* ---------- 安装包：本地算 sha256 与大小，并上传到服务器 ---------- */

/** 把字节数说成人话（用户要的是"多少 MB"，不是一串数字）。 */
function mbText(bytes){ return (bytes / 1048576).toFixed(2) + " MB"; }

/** 浏览器端算 sha256。要求安全上下文（https 或 localhost），否则 WebCrypto 不可用。 */
async function sha256Hex(file){
  if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) {
    throw new Error("这个页面不是 https 打开的，浏览器不让算校验值——请改用 https://39.106.33.135/admin/");
  }
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/** 从文件名里猜版本号：dongfang-wuxian-v1.0.0.apk → 1.0.0 */
function versionFromName(name){
  const m = /v?(\d+\.\d+\.\d+)/.exec(name || "");
  return m ? m[1] : "";
}

/** 把安装包 PUT 到服务器（nginx dav + basic auth），成功后就落在 /apk/ 下。 */
async function uploadApk(file, filename){
  if (!adminPass) {
    const p = prompt("请输入后台密码（与登录密码相同），只用于这一次上传：");
    if (!p) throw new Error("已取消上传");
    adminPass = p;
  }
  const r = await fetch("/admin/apk-upload/" + encodeURIComponent(filename), {
    method: "PUT",
    headers: { "Authorization": "Basic " + btoa(adminUser + ":" + adminPass) },
    body: file
  });
  if (r.status === 401) { adminPass = ""; throw new Error("后台密码不对，请重试"); }
  if (!r.ok) throw new Error("上传失败（" + r.status + "）");
  /*
   * [DFW-117 2026-10-02] **把服务端解析出的真实版本号带回去。**
   *
   * 服务端会在落盘后读 APK 里二进制的 AndroidManifest.xml，取出它自己的
   * versionCode / versionName —— 那才是「用户装上之后手机里会是几」的真值。
   * 控制台原来靠「上一条记录 + 1」猜，猜错了用户就永远收不到更新。
   */
  try { return await r.json(); } catch(e){ return null; }
}

/* ---------- 骨架 ---------- */
const TABS = ["总控","AI 渠道","版本","公告","更新记录"];
/**
 * [2026-10-03 视觉重置] 外壳：加一条**实时状态条**，把"现在线上是什么状态"直接摆在最上面。
 *
 * 为什么值得加（不是装饰）：这个后台最危险的误操作是「在维护模式开着的时候发版」
 * 或「不知道当前线上是哪个版本就点了发布」。原来这些信息散在各 tab 里，
 * 要点进去才知道。状态条把它提到第一屏，改一个字符的成本都没有。
 */
function statusStrip(){
  const c = cache.control || {};
  const maint = !!c.maintenanceOn || !!c.blocked;
  const r = cache.release ? relFields(cache.release) : null;
  const n = (cache.notice || []).filter(x => x.enabled !== false).length;
  const pill = (on, label) =>
    `<span class="pill${on ? " on" : ""}">${esc(label)}</span>`;
  return `<div class="statusbar">
    ${pill(!maint, maint ? "维护中 · 用户被拦住" : "正常运行")}
    ${pill(true, r ? "线上版本 " + r.versionName + "（序号 " + r.versionCode + "）" : "线上没有版本记录")}
    ${pill(true, n > 0 ? "生效公告 " + n + " 条" : "没有生效公告")}
  </div>`;
}

function renderShell(){
  $("#app").innerHTML = `
  <div class="hd">
    <h1>东方无限 · 控制台</h1>
    <p class="sub">在这里修改的内容，用户打开软件后会自动同步</p>
  </div>
  ${statusStrip()}
  <div class="tabs" id="tabs">
    ${TABS.map(t => `<div class="tab${t===tab?" active":""}" data-t="${t}">${t}</div>`).join("")}
  </div>
  <div id="pane"></div>
  <div style="height:20px"></div>
  <div class="row"><button class="btn-sec" id="out">退出登录</button></div>`;
  $("#tabs").onclick = e => {
    const t = e.target.closest(".tab"); if (!t) return;
    tab = t.dataset.t; renderShell(); renderPane();
  };
  $("#out").onclick = logout;
  renderPane();
}

/* ---------- 分页渲染 ---------- */
function renderPane(){
  const p = $("#pane");
  if (tab === "总控") return renderControl(p);
  if (tab === "AI 渠道") return renderAiChannel(p);
  if (tab === "版本") return renderRelease(p);
  if (tab === "公告") return renderNotice(p);
  if (tab === "更新记录") return renderChangelog(p);
}

/* ---------- 总控 ---------- */
function renderControl(p){
  const c = cache.control || { maintenanceOn:false, blocked:false, maintenanceTitle:"", maintenanceBody:"", maintenanceUntil:"" };
  const on = !!c.maintenanceOn || !!c.blocked;
  p.innerHTML = `
  <div class="card">
    <h2>维护 / 停用</h2>
    <p class="hint">打开后，所有用户的软件会被全屏拦住，只能看到你写的公告</p>
    <div class="switch">
      <div><div class="t">开启维护模式</div><div class="d">用户将无法使用软件</div></div>
      <div class="tg${on?" on":""}" id="mtg"></div>
    </div>
    <div id="mfields" class="${on?"":"hide"}">
      <label for="mt">标题</label>
      <input id="mt" type="text" placeholder="例如：维护中 / 已停更" value="${esc(c.maintenanceTitle)}">
      <label for="mb">正文（想写什么就写什么）</label>
      <textarea id="mb" placeholder="例如：服务器升级，预计今晚 20:00 恢复。">${esc(c.maintenanceBody)}</textarea>
      <label for="mu">维护时间（单独显示一行；填“永久”也可以，留空则不显示）</label>
      <input id="mu" type="text" placeholder="例如：永久 / 10 月 1 日 20:00" value="${esc(c.maintenanceUntil)}">
    </div>
    <div class="note warn">服务器连不上时，软件会当作“正常”处理，不会把用户锁在外面。</div>
    <div style="height:14px"></div>
    <button class="btn-main" id="save">保存</button>
  </div>`;
  const tg = $("#mtg");
  tg.onclick = () => {
    const nowOn = !tg.classList.contains("on");
    tg.classList.toggle("on", nowOn);
    $("#mfields").classList.toggle("hide", !nowOn);
  };
  $("#save").onclick = async () => {
    const b = $("#save"); b.disabled = true; b.innerHTML = '<span class="spin"></span> 保存中…';
    try {
      const on2 = $("#mtg").classList.contains("on");
      // 只提交维护相关字段（部分更新），不碰 AI 渠道那一页的设置。
      const body = {
        maintenanceOn: on2, blocked: false,
        maintenanceTitle: $("#mt").value.trim(),
        maintenanceBody: $("#mb").value.trim(),
        maintenanceUntil: $("#mu").value.trim()
      };
      await upsert("control", cache.control && cache.control.id, body);
      toast(on2 ? "已开启维护，用户将看到你的公告" : "已保存", "ok");
      await refresh();
    } catch(e){ toast(e.message, "err"); }
    b.disabled = false; b.textContent = "保存";
  };
}

/* ---------- AI 渠道（远程控制） ---------- */
/**

 * > "我希望你在我的控制台里面再加一个板块……可以改 URL、Key、最大输出、模型名字等等等等的。
 * >  但是我是远程控制的，而不是在软件内控制的。"

    <div class="switch">

  const aiTg = $("#aitg");
  aiTg.onclick = () => aiTg.classList.toggle("on");

  /*
   * 清单来自服务器上游的 `/v1/models`（在服务器上拉的，不经过 App）。
   * 2026-10-01 实测：`hy4` 与 `mimo-v2.5` 调用返回 403 "currently off due to limited stock"
   * —— 上游缺货停用。仍然列出来（随时可能恢复），但在按钮上标出来，免得切过去不能用。
   */
  const AIMODELS = ["glm-5.2","hy4","mimo-v2.5","glm-5.3","kimi-k3","deepseek-v4.1-flash",
    "glm-5.3-flashx","glm-5.3-flash","deepseek-v4-flash","mimo-v2.5-pro"];
  const AIMODELS_OFF = ["hy4","mimo-v2.5"];
  const aimNow = $("#aimnow"), aimList = $("#aimlist"), aimInput = $("#aim"), aidInput = $("#aid");

      if (!aidInput.value.trim() || AIMODELS.includes(aidInput.value.trim())) aidInput.value = b.dataset.m;

      await upsert("control", cache.control && cache.control.id, body);
      toast("已保存，用户下次打开软件生效", "ok");
      await refresh();
    } catch(e){ toast(e.message, "err"); }
    b.disabled = false; b.textContent = "保存";
  };
}

/* ---------- 版本：发新版 / 当前版本 / 发布历史（编辑·删除·回滚） ---------- */
/** 待上传的安装包（选完文件后暂存，点保存时真正上传）。 */
let pendingApk = null;
/** 安装包对外地址的固定前缀：**故意用 http**——App 走的是明文下载，
 *  改成 https 会因为那张证书不被设备信任而直接下载失败。 */
const APK_ORIGIN = "http://39.106.33.135";

/**
 * [DFW-106] **发布历史另起一个集合，绝不放进 `release`。**
 *
 * 三条都是实测出来的，不是推测：
 *
 * 1. App 读的就是 `release` 的 `perPage=1&sort=-id` 第一条。而 `release` 的 id 是
 *    PocketBase 随机生成的 `[a-z0-9]{15}`，**字符串排序和创建时间毫无关系**。
 *    实测：按 1→2→3 的顺序插入三条记录，`sort=-id` 返回的第一条是**最旧的 1 号**
 *    （三条的返回顺序是 1、3、2）。也就是说，只要 `release` 里出现第二条记录，
 *    App 就可能读到**随机一条**——表现正是 DFW-82 那个「改了版本号但用户收不到更新」
 *    的静默故障，而且这次连"没改版本号"都看不出来。
 * 2. `set-release.py`（命令行发版走的那个）是直接 PATCH「`sort=-id` 第一条」的，
 *    历史混在 `release` 里会被它**原地覆盖**。
 * 3. `reconcile-release.py` 每 60 秒把「其它记录里最大的 versionCode」抬到当前记录上，
 *    历史混在 `release` 里，**回滚会在 60 秒内被它悄悄改回去**。
 *
 * 所以：`release` 永远只保留一条（= 用户正在拿到的版本），历史单独一个集合。
 * App 的命脉查询、以及那两个脚本的行为，一个字都不用改。
 */
const HIST = "/release_history";
const HIST_PER = 20;
/**
 * 建历史集合用的字段定义（页面与 `server/dfwx-pb/README.md` 里的说明必须一致）。
 *
 * ⚠️ `created` / `updated` **必须显式声明**：PocketBase 建集合时不会自动加这两个系统字段
 * （`release` 集合就没有，所以那边 `sort=-created` 一直返回 400）。历史要按时间排、要分页，
 * 靠的就是这个 `created`。字段 id 可以不写，PocketBase 会自己补。
 */
const HIST_FIELDS = [
  { name:"versionName", type:"text",   required:true,  max:32 },
  { name:"versionCode", type:"number", required:true },
  { name:"apkUrl",      type:"url",    required:true },
  { name:"sha256",      type:"text",   required:true,  max:80 },
  { name:"size",        type:"number", required:true },
  { name:"updateMode",  type:"select", required:true,  values:["soft","force","off"], maxSelect:1 },
  { name:"action",      type:"select", required:false, values:["publish","rollback","edit","cli"], maxSelect:1 },
  { name:"note",        type:"text",   required:false, max:200 },
  { name:"created",     type:"autodate", onCreate:true, onUpdate:false },
  { name:"updated",     type:"autodate", onCreate:true, onUpdate:true }
];
const MODE_TEXT = { soft:"软更新", force:"强制更新", off:"不提示" };
const ACTION_TEXT = { publish:"发布", rollback:"回滚", edit:"改动", cli:"命令行发布" };

/** 当前正在编辑的那条发布记录：`{key, current}`；null = 都是列表态。 */
let editingRel = null;

/** PocketBase 的时间戳（`2026-10-02 15:04:52.652Z`）→ 人话。空格换成 T 才是合法 ISO。 */
function fmtTime(s){
  if (!s) return "";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d.getTime())) return String(s);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/** 只取一条记录里跟「发布」有关的字段：渲染、写回、回滚都用同一套。 */
function relFields(o){
  return {
    versionName: String((o && o.versionName) || ""),
    versionCode: Number((o && o.versionCode) || 0),
    apkUrl:      String((o && o.apkUrl) || ""),
    sha256:      String((o && o.sha256) || ""),
    size:        Number((o && o.size) || 0),
    updateMode:  (o && o.updateMode) || "soft"
  };
}

/**
 * [DFW-82 / DFW-118 / 2026-10-03 改版] **版本序号的合法性校验** —— 这一条仍然硬拦。
 *
 * 只拦「发出去软件读不懂」的值：非整数、0、负数。这是输入校验，不是产品决策，
 * 所以它继续抛错；**不再有任何 confirm**。
 */
function assertVersionCode(nextCode){
  if (!Number.isInteger(nextCode) || nextCode <= 0) {
    throw new Error("版本序号必须是不小于 1 的整数");
  }
}

/**
 * [2026-10-03 用户要求] **版本序号的过渡提示** —— 只返回一句提醒，**不拦截、不弹窗**。
 *
 * ## 为什么从「拦截」改成「提示」
 *
 * 用户原话：
 * > 「能不能改为我自个填版本号和版本序号？不要让它再弹出来那个弹窗阻止我了，
 * >   只要我发布的版本号和版本序号高于我现在的版本，那它就会弹更新」
 *
 * 用户说得对，理由也充分：**规则本身很简单，而且用户已经完全理解它** ——
 * 「序号填得比现在大 → 软件就会弹更新」。既然规则是确定的、用户是懂的，
 * 就没有理由再用一个 confirm 去挡他。挡住的只是他自己。
 *
 * 真正需要挡的只有「填了个软件读不懂的值」，那个由 `assertVersionCode` 负责。
 *
 * ## 但提示必须留着，而且必须说清后果
 *
 * 下面两句提醒不是走过场 —— 它们描述的是**用户在后台看不出来的后果**：
 *   · **序号填小了**：已经装了新版的人**收不到更新提示**，界面上完全看不出为什么；
 *   · **序号填一样**：软件认为「已是最新版」，**不弹任何窗口**。
 *
 * 这两种情况在后台看起来都是「发布成功」，所以必须在这里说清楚 ——
 * 否则用户会以为是更新功能坏了。**DFW-82「能下到新包但永远不提示更新」就是这么来的。**
 *
 * @param {number} nextCode    这次要发的序号
 * @param {number} currentCode 当前线上的序号（0 = 还没有版本）
 * @param {string} mode        "publish" | "switch" | "editCurrent"
 * @returns {string} 空字符串 = 没问题；否则是要显示给用户看的提醒
 */
function versionTransitionWarning(nextCode, currentCode, mode){
  if (!Number.isInteger(nextCode) || nextCode <= 0) {
    return "版本序号要填不小于 1 的整数，否则发出去软件读不懂。";
  }
  if (!(currentCode > 0)) return "";
  if (nextCode < currentCode) {
    return "这次的序号比当前小（当前 " + currentCode + "，本次 " + nextCode + "）："
      + "已经装了序号 " + currentCode + " 的用户收不到更新提示，得手动卸载重装一次。"
      + "想让所有人都收到更新，序号要填得比 " + currentCode + " 大。";
  }
  if (nextCode === currentCode && mode !== "editCurrent") {
    return "这次的序号和当前一样（都是 " + currentCode + "）："
      + "软件会认为已经是最新版，不会弹任何更新提示。"
      + "想让更新弹出来，序号要填得比 " + currentCode + " 大。";
  }
  return "";
}

/** 拉一页历史。集合还没建时**不抛**，只标记 `histMissing`，由页面给一个「创建」按钮。 */
async function loadHistory(page){
  try {
    const d = await api(HIST + "/records?perPage=" + HIST_PER + "&page=" + (page || 1) + "&sort=-created");
    cache.histMissing = false;
    cache.histError = "";
    cache.history = d.items || [];
    cache.histPage = d.page || 1;
    cache.histTotal = d.totalItems || 0;
    cache.histPages = d.totalPages || 1;
    // 删到最后一页空了：自动退回最后一页，否则会停在一个永远空白的页上。
    if (cache.histPage > cache.histPages) {
      cache.histPage = Math.max(1, cache.histPages);
      return loadHistory(cache.histPage);
    }
  } catch(e){
    cache.history = [];
    cache.histTotal = 0;
    cache.histPages = 1;
    cache.histMissing = (e && e.status === 404);
    cache.histError = cache.histMissing ? "" : (e.message || "读取发布历史失败");
  }
}

/** 集合不存在时点这个按钮：按 HIST_FIELDS 把集合建出来。 */
async function createHistoryCollection(){
  await api("", { method:"POST", body: JSON.stringify({
    name: HIST.replace(/^\//, ""),
    type: "base",
    // 历史只给登录后的后台看：不给 App，也不给匿名读。
    listRule: null, viewRule: null, createRule: null, updateRule: null, deleteRule: null,
    fields: HIST_FIELDS
  })});
}

/** 往历史里追一条。**写历史失败不许拖垮发布本身** —— 发布已经生效了，缺的只是一条日志。 */
async function snapshot(f, action, note){
  try {
    await api(HIST + "/records", { method:"POST", body: JSON.stringify({
      versionName: f.versionName, versionCode: f.versionCode, apkUrl: f.apkUrl,
      sha256: f.sha256, size: f.size, updateMode: f.updateMode,
      action: action || "publish", note: note || ""
    })});
  } catch(e){
    toast("已生效，但历史记录没写进去：" + e.message, "err");
  }
}

/** 一条发布记录的卡片。`key` 是编辑态的键：当前版本固定用 `cur`，历史条目用它的记录 id。 */
function relItemHtml(key, o, isCurrent, meta){
  if (editingRel && editingRel.key === key) return relEditForm(key, isCurrent);
  const f = relFields(o);
  const shortSha = f.sha256 ? f.sha256.slice(0, 16) + (f.sha256.length > 16 ? "…" : "") : "（未填）";
  return `
    <div class="item">
      <div class="top">
        <div>
          <div class="name">${esc(f.versionName || "（未填版本号）")}
            <span style="color:var(--muted);font-weight:400">· 序号 ${f.versionCode}</span>
            ${isCurrent ? '<span style="color:var(--ok);font-size:12px"> ● 当前</span>' : ""}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
          <div class="meta">${MODE_TEXT[f.updateMode] || esc(f.updateMode)} · ${f.size ? mbText(f.size) : "大小未填"} · sha256 ${esc(shortSha)}</div>
          <div class="meta" style="word-break:break-all">${esc(f.apkUrl || "（未填下载地址）")}</div>
        </div>
      </div>
      <div style="height:10px"></div>
      <div class="row">
        ${isCurrent ? "" : `<button class="btn-main" data-rollback="${esc(key)}">设为当前</button>`}
        <button class="btn-sec" data-editrel="${esc(key)}">编辑</button>
        <button class="btn-danger" data-delrel="${esc(key)}">删除</button>
      </div>
    </div>`;
}

/** 编辑表单。同一时刻只会开一个，所以用固定 id 就够了。 */
function relEditForm(key, isCurrent){
  const f = relFields(isCurrent ? cache.release : (cache.history || []).find(x => x.id === key));
  const sel = v => `<option value="${v}"${f.updateMode === v ? " selected" : ""}>${MODE_TEXT[v]}</option>`;
  return `
    <div class="item">
      <div class="name" style="margin-bottom:4px">${isCurrent ? "编辑当前版本" : "编辑这条历史记录"}</div>
      <div class="meta" style="margin-bottom:10px">${isCurrent
        ? "这一条就是用户正在拿到的版本，改完立刻生效。"
        : "改的是历史日志本身，不影响用户现在拿到的版本。"}</div>
      <label>版本号（显示给用户看的）</label>
      <input id="evn" type="text" value="${esc(f.versionName)}" placeholder="1.0.0">
      <label>版本序号（versionCode）</label>
      <input id="evc" type="number" min="1" value="${f.versionCode}">
      <label>更新方式</label>
      <select id="eum">${sel("soft")}${sel("force")}${sel("off")}</select>
      <label>安装包大小</label>
      <input id="eszText" type="text" readonly value="${f.size ? mbText(f.size) : "（未填）"}">
      <label>校验值（sha256）</label>
      <input id="esh" type="text" value="${esc(f.sha256)}">
      <label>下载地址</label>
      <input id="eau" type="text" value="${esc(f.apkUrl)}">
      <input id="esz" type="hidden" value="${f.size || ""}">
      <div style="height:12px"></div>
      <div class="row">
        <button class="btn-main" data-saverel="1">保存修改</button>
        <button class="btn-sec" data-cancelrel="1">取消</button>
      </div>
    </div>`;
}

/** 保存编辑。当前版本要严格校验（那是用户真会去下载的地址），历史条目宽松些。 */
async function saveRelEdit(key, isCurrent){
  const body = {
    versionName: $("#evn").value.trim(),
    versionCode: Number($("#evc").value || 0),
    updateMode: $("#eum").value,
    apkUrl: $("#eau").value.trim(),
    sha256: $("#esh").value.trim().toLowerCase(),
    size: Number($("#esz").value || 0)
  };
  if (!body.versionName) throw new Error("请填写版本号");
  if (!body.apkUrl) throw new Error("请填写下载地址");
  if (isCurrent) {
    if (!cache.release) throw new Error("当前没有版本记录，刷新一下再试");
    if (!/^[0-9a-f]{64}$/.test(body.sha256)) {
      throw new Error("校验值必须是 64 位十六进制 —— 这一条是用户真正会下载的版本，写错了用户装不上");
    }
    if (!(body.size > 0)) throw new Error("大小必须大于 0 —— 这一条是用户真正会下载的版本");
    assertVersionCode(body.versionCode);
    /* [2026-10-03] 只提示不拦截：编辑当前记录时把序号改小，等于给所有人降级。 */
    const editWarn = versionTransitionWarning(body.versionCode, relFields(cache.release).versionCode, "editCurrent");
    if (editWarn) toast(editWarn, "err");
    await api("/release/records/" + cache.release.id, { method:"PATCH", body: JSON.stringify(body) });
    toast("已保存，用户下次打开软件生效", "ok");
  } else {
    await api(HIST + "/records/" + key, { method:"PATCH", body: JSON.stringify(body) });
    toast("历史记录已保存", "ok");
  }
}

/** 回滚：把某条历史重新设为「当前版本」——写回 release 那一条，并留一条回滚日志。 */
async function rollbackTo(key){
  const h = (cache.history || []).find(x => x.id === key);
  if (!h) throw new Error("这条历史记录不在当前页了，刷新一下再试");
  const f = relFields(h);
  if (!f.apkUrl) throw new Error("这条历史没有下载地址，不能回滚");
  if (!/^[0-9a-f]{64}$/.test(f.sha256)) {
    throw new Error("这条历史的校验值不是 64 位十六进制，直接回滚用户会装不上 —— 请先「编辑」把它补对");
  }
  if (!(f.size > 0)) throw new Error("这条历史的大小是 0，直接回滚用户会装不上 —— 请先「编辑」把它补对");
  const cur = cache.release ? relFields(cache.release) : null;
  assertVersionCode(f.versionCode);
  const ok = confirm("把当前版本回滚到「" + f.versionName + "」（序号 " + f.versionCode + "）？\n\n"
    + "用户下次打开软件就会拿到这个版本的下载地址。\n"
    + "已经装了更新版本的用户**不会**收到提示（软件只往「更新」的方向提示），要他们降级只能手动卸载重装。");
  if (!ok) return;
  await upsert("release", cache.release && cache.release.id, f);
  await snapshot(f, "rollback", "回滚自 " + (cur ? cur.versionName + "（序号 " + cur.versionCode + "）" : "无记录"));
  toast("已回滚到 " + f.versionName, "ok");
  await refresh();
}

/** 删除当前版本记录：等于让 App 读不到任何版本，后果要说清楚。 */
async function deleteCurrentRelease(){
  if (!cache.release) return;
  const f = relFields(cache.release);
  if (!confirm("删除「当前版本」记录？\n\n"
    + "现在下发的是 " + f.versionName + "（序号 " + f.versionCode + "）。\n"
    + "删掉之后 App 读不到任何版本记录，**所有用户都不会再收到更新提示**，直到你重新发布一条。\n\n"
    + "发布历史不会跟着删，随时可以从历史里「设为当前」恢复。确定删除？")) return;
  await api("/release/records/" + cache.release.id, { method:"DELETE" });
  toast("已删除当前版本记录", "ok");
  await refresh();
}

/** 删除一条历史日志（不影响当前下发的版本）。 */
async function deleteHistory(key){
  const h = (cache.history || []).find(x => x.id === key);
  if (!confirm("删除历史记录「" + ((h && h.versionName) || key) + "」？\n\n只删这条日志，不影响用户现在拿到的版本。")) return;
  await api(HIST + "/records/" + key, { method:"DELETE" });
  toast("已删除", "ok");
  await refresh();
}

/** 历史列表的 HTML（空态也在这一处处理）。 */
function histHtml(){
  const hist = cache.history || [];
  if (!hist.length) return '<div class="empty">还没有历史记录。发布一次或回滚一次就会出现。</div>';
  return hist.map(h => relItemHtml(h.id, h, false,
    (ACTION_TEXT[h.action] || "发布")
    + (h.created ? " · " + fmtTime(h.created) : "")
    + (h.note ? " · " + esc(h.note) : ""))).join("");
}

/** 历史分页条。只有一页时什么都不显示。 */
function histPagerHtml(){
  const pages = cache.histPages || 1, cur = cache.histPage || 1;
  if (pages <= 1) return "";
  return `<div class="row" style="margin-top:12px">
    <button class="btn-sec" data-page="${cur - 1}"${cur <= 1 ? " disabled" : ""}>上一页</button>
    <div style="flex:0 0 auto;min-width:auto;display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:13px">第 ${cur} / ${pages} 页</div>
    <button class="btn-sec" data-page="${cur + 1}"${cur >= pages ? " disabled" : ""}>下一页</button>
  </div>`;
}

function renderRelease(p){
  const r = cache.release;
  /*
   * [DFW-106] 「版本序号」预填的是**当前值本身**，不是"当前值加一"。
   *
   * 这是 fail-safe：万一读不出安装包里的真实序号，输入框停在当前值上，
   * 守卫会把它当成「序号相等」**硬拦**下来 —— 而不是静默发一个猜出来的高序号
   * （那正是 DFW-82「能下到新包但永远不提示更新」的形态）。
   *
   * ⚠️ 所以下面这句提示必须**跟着当前值动态生成**：既不能写死数字，也不能再承诺
   * 「已经替你把序号加好了」—— DFW-118 路线 B 把预填从 `last + 1` 改成 `last` 时
   * 漏改了这句，文案一直和真实行为不符（用户照做会被守卫拦下，显得"说了帮忙却没帮"）。
   *
   * [2026-10-03] 又改了一次：**不再覆盖用户填的值**，所以末尾那句
   * 「点保存时会先用安装包里的真实序号覆盖这里」已经过期，删掉换成现在的真实行为。
   */
  const curCode = Number(r && r.versionCode) || 0;
  const vcHint = (curCode > 0
      ? `软件就是拿这个数字比大小的：<b>填得比现在（${curCode}）大，用户就会收到更新提示</b>；填小了或填一样，就不会弹。`
      : `软件就是拿这个数字比大小的：<b>必须是个正整数</b>，而且以后每次发版都得比上一版大。`)
    + `这个数字<b>你自己填</b>，填什么就发什么（选了安装包也不会改你填的值）。`;
  pendingApk = null;
  p.innerHTML = `
  <div class="card">
    <h2>发新版</h2>
    <p class="hint">用户打开软件时会比对这里的版本号，低于它就会提示更新</p>

    <label for="apk">① 选择安装包（.apk）</label>
    <input id="apk" type="file" accept=".apk,application/vnd.android.package-archive">
    <div class="note" id="apkInfo">选好文件后，<b>大小与校验值会自动算好</b>，点保存时顺带传上服务器——不用手填。</div>

    <label for="vn">② 版本号（显示给用户看的）</label>
    <input id="vn" type="text" placeholder="1.0.0" value="${esc(r ? r.versionName : "")}">

    <label for="vc">③ 版本序号（versionCode）—— 决定软件会不会提示更新</label>
    <input id="vc" type="number" min="1" value="${Number(r && r.versionCode) || 0}">
    <p class="hint">${vcHint}</p>
    <!-- [2026-10-03] 常驻提醒区：序号填得比当前小/一样时，在这里当场说明后果。
         放在**点按钮之前**就能看到，所以不需要再用 confirm 弹窗去挡。 -->
    <div class="note warn hide" id="vcWarn"></div>

    <label for="um">④ 更新方式</label>
    <select id="um">
      <option value="soft"${!r || r.updateMode==="soft"?" selected":""}>软更新 —— 用户可以关闭、可以不再提示</option>
      <option value="force"${r && r.updateMode==="force"?" selected":""}>强制更新 —— 必须更新才能用</option>
      <option value="off"${r && r.updateMode==="off"?" selected":""}>不提示 —— 静默发布，不弹任何窗口</option>
    </select>

    <div class="note">下面三项在选完安装包后自动带出，一般不用改。</div>
    <label>安装包大小</label>
    <input id="szText" type="text" readonly value="${r && r.size ? mbText(r.size) : "（选文件后自动算出）"}">
    <label for="sh">校验值（sha256）</label>
    <input id="sh" type="text" value="${esc(r ? r.sha256 : "")}">
    <label for="au">下载地址</label>
    <input id="au" type="text" value="${esc(r ? r.apkUrl : "")}">
    <input id="sz" type="hidden" value="${r && r.size ? r.size : ""}">

    <div style="height:14px"></div>
    <button class="btn-main" id="save">保存并发布</button>
  </div>

  <div class="card">
    <h2>当前版本${r ? "" : "（没有）"}</h2>
    <p class="hint">用户打开软件时读到的就是这一条（App 请求 <code>/pb/api/collections/release/records?perPage=1&amp;sort=-id</code>）。
      <b>release 集合永远只保留这一条</b>——多一条，App 就可能随机读到别的版本，所以历史另存一个集合。</p>
    ${r ? relItemHtml("cur", r, true, "") : '<div class="empty">没有任何版本记录，用户不会收到更新提示</div>'}
  </div>

  <div class="card">
    <h2>发布历史（${cache.histTotal}）</h2>
    <p class="hint">每次「发新版」和「回滚」都会在这里留一条。可以编辑、删除，或者一键把它重新设为当前版本。</p>
    ${cache.histMissing
      ? '<div class="note warn">发布历史集合（<code>release_history</code>）还没建。<br>点下面的按钮建一下就好，不会动到现有数据。</div>'
        + '<button class="btn-main" id="mkhist">创建发布历史集合</button>'
      : `${cache.histError ? '<div class="note danger">读发布历史失败：' + esc(cache.histError) + '</div>' : ""}
        <div id="hlist">${histHtml()}</div>
        ${histPagerHtml()}`}
  </div>`;

  /**
   * [2026-10-03] 序号填得不对时，**当场**在输入框下面说明后果 —— 而不是等点按钮时弹窗挡。
   * 跟着输入实时刷新，用户边填边能看到；点「保存并发布」时也会再刷一次。
   */
  const refreshVcWarn = () => {
    const box = $("#vc"), tip = $("#vcWarn");
    if (!box || !tip) return;
    const msg = versionTransitionWarning(Number(box.value || 0), curCode, "publish");
    if (msg) {
      tip.textContent = msg;
      tip.classList.remove("hide");
    } else {
      tip.textContent = "";
      tip.classList.add("hide");
    }
  };
  $("#vc").oninput = refreshVcWarn;
  refreshVcWarn();

  $("#apk").onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const info = $("#apkInfo");
    try {
      info.textContent = "正在计算校验值…（" + mbText(f.size) + "）";
      const hex = await sha256Hex(f);
      pendingApk = { file: f, hex: hex, size: f.size, name: f.name };
      $("#sh").value = hex;
      $("#sz").value = f.size;
      $("#szText").value = mbText(f.size);
      const v = versionFromName(f.name);
      if (v) $("#vn").value = v;              // 文件名里通常就带版本号
      $("#au").value = APK_ORIGIN + "/apk/" + f.name;
      info.innerHTML = "✅ 已就绪：<b>" + esc(f.name) + "</b> · " + mbText(f.size)
        + " · 点「保存并发布」会上传并生效";
    } catch(err){
      pendingApk = null;
      info.textContent = "❌ " + err.message;
    }
  };

  $("#save").onclick = async () => {
    const b = $("#save"); b.disabled = true; b.innerHTML = '<span class="spin"></span> 处理中…';
    try {
      if (pendingApk) {                       // 先传包，再写记录——顺序反了会出现"记录指向不存在的文件"
        b.innerHTML = '<span class="spin"></span> 上传安装包…';
        const meta = await uploadApk(pendingApk.file, pendingApk.name);
        /*
         * [DFW-117 → 2026-10-03 改版] 这里原来是**无条件用包里的序号覆盖输入框**。
         *
         * 原来的理由（DFW-117）是成立的：用户上传的那个 APK 就是新版本，它的 versionCode
         * 才是真值，比"上一条 + 1"这种猜法可靠。但**无条件覆盖**带来了一个用户直接撞上的问题：
         *
         *   用户自己填好序号 → 选了一个内部序号很小的 APK（比如别家软件的 `1`）
         *   → 输入框被盖成 1 → 紧接着被判"比当前小"拦下
         *   → 用户的感受是「我明明填了，它却给我改了，还不让我发」。
         *
         * 用户原话：
         * > 「能不能改为我自个填版本号和版本序号？……结果它居然自动填充了」
         *
         * 现在改成：**只在输入框是空 / 0 的时候才预填**（纯省事），
         * 用户已经填了值就**一律保留**，包里的值只作为一句参考信息告诉他。
         * 这样"帮我省事"和"别改我填的"两件事就不打架了。
         */
        if (meta && meta.versionCode) {
          const box = $("#vc");
          const typed = Number(box.value || 0);
          const pkgName = meta.versionName || "";
          if (typed > 0) {
            toast("你填的序号 " + typed + " 保留不动（包里这个 APK 的真实序号是 "
              + meta.versionCode + (pkgName ? "，版本名 " + pkgName : "") + "）", "ok");
          } else {
            box.value = meta.versionCode;
            if (pkgName) $("#vn").value = pkgName;
            toast("输入框原来是空的，已替你填上包里的真实版本号：" + pkgName + "（" + meta.versionCode + "）", "ok");
          }
          refreshVcWarn();
        } else {
          toast("读不出包里的版本号 —— 没关系，上面「版本序号」填什么就用什么", "err");
        }
      }
      /*
       * [DFW-82] 这里原来是 `versionCode: cache.release ? cache.release.versionCode : 0` ——
       * **把旧的 versionCode 原样回写**，而页面上根本没有这个输入框。
       * 结果：不管怎么发布，版本序号永远不变，软件永远判定"已是最新版本"。
       * 用户 2026-10-01 报的"更新功能坏掉了"就是这一行。
       * 现在改成读输入框，并且**强制严格递增**。
       *
       * [DFW-106 → 2026-10-03] 这两条规则已抽成 `assertVersionCode`（硬拦非法值）
       * 与 `versionTransitionWarning`（只提示不拦截），由「发新版」「回滚」「编辑当前版本」
       * 三条路径共用。**注意：原来的「相等硬拦 / 变小 confirm」已按用户要求取消** ——
       * 见 `versionTransitionWarning` 的注释。
       */
      const currentCode = Number(cache.release && cache.release.versionCode) || 0;
      const nextCode = Number($("#vc").value || 0);
      const body = {
        versionName: $("#vn").value.trim(),
        versionCode: nextCode,
        updateMode: $("#um").value,
        apkUrl: $("#au").value.trim(),
        sha256: $("#sh").value.trim().toLowerCase(),
        size: Number($("#sz").value || 0)
      };
      if (!body.versionName) throw new Error("请填写版本号");
      /*
       * [2026-10-03 用户要求] 这里原来是一个 confirm「序号比当前小，确定吗？」——
       * 点「拒绝」就抛错，整个发布被挡下来。用户明确要求去掉：
       * > 「不要让它再弹出来那个弹窗阻止我了，只要我发布的版本号和版本序号
       * >   高于我现在的版本，那它就会弹更新」
       *
       * 现在拆成两件事：
       *   · `assertVersionCode` —— 只拦"软件读不懂的值"（非正整数），这个仍然抛错；
       *   · `versionTransitionWarning` —— 序号偏小时给一句**非阻塞**的提醒，
       *     发布照常进行。提醒内容会同时出现在按钮上方的常驻提示区（见 #vcWarn），
       *     所以用户在点之前就已经看到了，不需要再弹一次。
       */
      assertVersionCode(nextCode);
      const transWarn = versionTransitionWarning(nextCode, currentCode, "publish");
      if (transWarn) toast(transWarn, "err");
      if (!/^[0-9a-f]{64}$/.test(body.sha256)) throw new Error("校验值必须是 64 位十六进制（选一个安装包就会自动算好）");
      if (!(body.size > 0)) throw new Error("请选择安装包，大小会自动算出来");
      /*
       * 版本名和现在一样、只有序号变了 —— 原来也是 confirm，同样改成非阻塞提醒。
       * 这本身是个完全合法的操作（比如只改了更新方式、或换了安装包但版本名还没改），
       * 不该用弹窗拦。
       */
      if (currentCode > 0 && body.versionName === (cache.release && cache.release.versionName) && nextCode > currentCode) {
        toast("版本名没变（还是 " + body.versionName + "），只有序号变了 —— 用户会收到更新提示，但显示的版本名不变", "ok");
      }
      await upsert("release", cache.release && cache.release.id, body);
      // [DFW-106] 发布成功后再往历史里追一条。写历史失败不影响发布本身（snapshot 内部已兜住）。
      await snapshot(body, "publish", "");
      toast("已发布，用户下次打开就会看到", "ok");
      pendingApk = null;
      cache.histPage = 1;
      await refresh();
    } catch(e){ toast(e.message, "err"); }
    b.disabled = false; b.textContent = "保存并发布";
  };

  /* 历史集合还没建：只给一个显式的「创建」按钮，不做偷偷建表这种事。 */
  if (cache.histMissing) {
    const mk = $("#mkhist");
    if (mk) mk.onclick = async () => {
      mk.disabled = true; mk.innerHTML = '<span class="spin"></span> 创建中…';
      try { await createHistoryCollection(); toast("发布历史集合已创建", "ok"); await refresh(); }
      catch(e){ toast(e.message, "err"); mk.disabled = false; mk.textContent = "创建发布历史集合"; }
    };
    return;
  }

  /*
   * 当前版本卡片与历史列表的事件都挂在**面板**上，不挂在列表容器上：
   * 编辑态是整块重渲染出来的，挂在容器上会变成游离节点（公告那一页踩过同样的坑）。
   */
  p.onclick = async e => {
    const roll = e.target.closest("[data-rollback]"), ed = e.target.closest("[data-editrel]"),
          del = e.target.closest("[data-delrel]"), save = e.target.closest("[data-saverel]"),
          cancel = e.target.closest("[data-cancelrel]"), pg = e.target.closest("[data-page]");
    try {
      if (pg) { cache.histPage = Number(pg.dataset.page); await refresh(); return; }
      if (roll) { await rollbackTo(roll.dataset.rollback); return; }
      if (ed) {
        const key = ed.dataset.editrel;
        editingRel = { key: key, current: key === "cur" };
        renderRelease(p);
        return;
      }
      if (cancel) { editingRel = null; renderRelease(p); return; }
      if (save) {
        const cur = !!(editingRel && editingRel.current);
        const key = editingRel && editingRel.key;
        editingRel = null;
        await saveRelEdit(key, cur);
        await refresh();
        return;
      }
      if (del) {
        if (del.dataset.delrel === "cur") await deleteCurrentRelease();
        else await deleteHistory(del.dataset.delrel);
      }
    } catch(err){ toast(err.message, "err"); }
  };
}

/* ---------- 公告 ---------- */
/** 当前正在编辑的公告 id（null = 列表态）。用一次重渲染来回切，不维护两套 DOM。 */
let editingNoticeId = null;

/** 公告编辑表单：**发布之后也要能改全部字段**（用户 2026-10-01 要求）。 */
function noticeEditForm(n){
  const pm = n.popupMode || "once";   // 与客户端 normalizeMode 一致：空值按「一次性」算
  const opt = (v, label) => `<option value="${v}"${pm===v?" selected":""}>${label}</option>`;
  return `
    <label for="et_${n.id}">标题</label>
    <input id="et_${n.id}" type="text" value="${esc(n.title||"")}" placeholder="例如：新版上线 / 重要通知">
    <label for="eb_${n.id}">内容</label>
    <textarea id="eb_${n.id}" placeholder="想对用户说的话">${esc(n.body||"")}</textarea>
    <label for="el_${n.id}">重要程度</label>
    <select id="el_${n.id}">
      <option value="normal"${n.level==="important"||n.level==="urgent"?"":" selected"}>普通</option>
      <option value="important"${n.level==="important"?" selected":""}>重要</option>
      <option value="urgent"${n.level==="urgent"?" selected":""}>紧急</option>
    </select>
    <div class="switch">
      <div><div class="t">弹出方式</div><div class="d">静默＝只进列表不打扰；一次性＝每条只弹一次；永久＝每次打开都弹</div></div>
      <select id="ep_${n.id}" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit">
        ${opt("silent","静默")}${opt("once","一次性")}${opt("always","永久")}
      </select>
    </div>
    <div class="switch">
      <div><div class="t">置顶</div><div class="d">排在公告列表最前面</div></div>
      <div class="tg${n.pinned?" on":""}" data-tg="pin_${n.id}"></div>
    </div>
    <div class="switch">
      <div><div class="t">启用</div><div class="d">关掉后 App 不再下发这一条</div></div>
      <div class="tg${n.enabled===false?"":" on"}" data-tg="en_${n.id}"></div>
    </div>
    <div style="height:12px"></div>
    <div class="row">
      <button class="btn-main" data-save="${n.id}">保存修改</button>
      <button class="btn-sec" data-cancel="1">取消</button>
    </div>`;
}

function renderNotice(p){
  const list = cache.notice || [];
  p.innerHTML = `
  <div class="card">
    <h2>发布新公告</h2>
    <p class="hint">公告会一直保留，用户随时可以在软件里翻看</p>
    <label for="nt">标题</label>
    <input id="nt" type="text" placeholder="例如：新版上线 / 重要通知">
    <label for="nb">内容</label>
    <textarea id="nb" placeholder="想对用户说的话"></textarea>
    <label for="nl">重要程度</label>
    <select id="nl">
      <option value="normal">普通</option>
      <option value="important">重要</option>
      <option value="urgent">紧急</option>
    </select>
    <div class="switch">
      <div><div class="t">弹出方式</div><div class="d">静默＝只进列表不打扰；一次性＝弹一次；永久＝每次打开都弹</div></div>
      <select id="np" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit">
        <option value="silent">静默</option>
        <option value="once" selected>一次性</option>
        <option value="always">永久</option>
      </select>
    </div>
    <div class="switch">
      <div><div class="t">置顶</div><div class="d">排在公告列表最前面</div></div>
      <div class="tg" id="npin"></div>
    </div>
    <div style="height:12px"></div>
    <button class="btn-main" id="pub">发 布</button>
  </div>
  <div class="card">
    <h2>已发布的公告（${list.length}）</h2>
    <p class="hint">越靠上的越新</p>
    <div id="nlist"></div>
  </div>`;
  $("#npin").onclick = () => $("#npin").classList.toggle("on");
  const box = $("#nlist");
  if (!list.length) box.innerHTML = '<div class="empty">还没有公告</div>';
  else box.innerHTML = list.map(n => `
    <div class="item">
      <div class="top">
        <div>
          <div class="name">${esc(n.title || "(无标题)")}</div>
          <div class="meta">${n.level==="urgent"?"紧急 · ":n.level==="important"?"重要 · ":""}${n.pinned?"置顶 · ":""}${n.enabled===false?"已停用 · ":""}${({silent:"静默",once:"一次性弹出",always:"永久弹出"})[n.popupMode||"once"]}</div>
        </div>
      </div>
      ${editingNoticeId===n.id ? noticeEditForm(n) : `
      <div style="margin-top:8px;color:var(--muted);font-size:13.5px;white-space:pre-wrap">${esc(n.body)}</div>
      <div style="height:10px"></div>
      <div class="row">
        <button class="btn-main" data-edit="${n.id}">编辑</button>
        <button class="btn-sec" data-pop="${n.id}">换成「${({silent:"一次性",once:"永久",always:"静默"})[n.popupMode||"once"]}」</button>
        <button class="btn-danger" data-del="${n.id}">删除</button>
      </div>`}
    </div>`).join("");
  box.onclick = async e => {
    const edit = e.target.closest("[data-edit]"), cancel = e.target.closest("[data-cancel]"),
          save = e.target.closest("[data-save]"), tg = e.target.closest("[data-tg]"),
          pop = e.target.closest("[data-pop]"), del = e.target.closest("[data-del]");
    // 开关就地切换，不重渲染——重渲染会把用户还没保存的输入冲掉
    if (tg) { tg.classList.toggle("on"); return; }
    try {
      if (edit) { editingNoticeId = edit.dataset.edit; renderNotice(p); return; }
      if (cancel) { editingNoticeId = null; renderNotice(p); return; }
      if (save) {
        const id = save.dataset.save, title = $("#et_"+id).value.trim(), body = $("#eb_"+id).value.trim();
        if (!title && !body) throw new Error("请至少填写标题或内容");
        // 用 p（面板）而不是 box 找开关：renderNotice 会整块换 DOM，box 会变成游离节点
        const pinEl = p.querySelector('[data-tg="pin_'+id+'"]'), enEl = p.querySelector('[data-tg="en_'+id+'"]');
        await api("/notice/records/" + id, { method:"PATCH", body: JSON.stringify({
          title, body, level: $("#el_"+id).value, popupMode: $("#ep_"+id).value,
          pinned: !!(pinEl && pinEl.classList.contains("on")),
          enabled: !!(enEl && enEl.classList.contains("on"))
        })});
        editingNoticeId = null;
        toast("已保存", "ok"); await refresh(); return;
      }
      if (pop) {
        const n = list.find(x => x.id === pop.dataset.pop);
        const next = ({silent:"once",once:"always",always:"silent"})[n.popupMode||"once"];
        await api("/notice/records/" + n.id, { method:"PATCH", body: JSON.stringify({ popupMode: next }) });
        toast("已修改", "ok"); await refresh();
      } else if (del) {
        if (!confirm("确定删除这条公告？")) return;
        await api("/notice/records/" + del.dataset.del, { method:"DELETE" });
        toast("已删除", "ok"); await refresh();
      }
    } catch(e){ toast(e.message, "err"); }
  };
  $("#pub").onclick = async () => {
    const b = $("#pub"); b.disabled = true; b.innerHTML = '<span class="spin"></span> 发布中…';
    try {
      const title = $("#nt").value.trim(), body = $("#nb").value.trim();
      if (!title && !body) throw new Error("请至少填写标题或内容");
      await api("/notice/records", { method:"POST", body: JSON.stringify({
        title, body, level: $("#nl").value,
        popupMode: $("#np").value,
        pinned: $("#npin").classList.contains("on"),
        enabled: true
      })});
      toast("发布成功", "ok"); await refresh();
    } catch(e){ toast(e.message, "err"); b.disabled = false; b.textContent = "发 布"; }
  };
}

/* ---------- 更新记录 ---------- */
function renderChangelog(p){
  const list = cache.changelog || [];
  p.innerHTML = `
  <div class="card">
    <h2>添加更新记录</h2>
    <p class="hint">用户更新完会看到这里的内容，也可以随时翻看历史</p>
    <label for="cv">版本号</label>
    <input id="cv" type="text" placeholder="1.22.20">
    <label for="cd">日期</label>
    <input id="cd" type="text" placeholder="2026-10-01">
    <label for="ch">这次改了什么（一行一条）</label>
    <textarea id="ch" placeholder="修复了更新检查不动的问题&#10;新增公告中心"></textarea>
    <div style="height:12px"></div>
    <button class="btn-main" id="add">添 加</button>
  </div>
  <div class="card">
    <h2>更新历史（${list.length}）</h2>
    <p class="hint">越靠上的越新</p>
    <div id="clist"></div>
  </div>`;
  const box = $("#clist");
  if (!list.length) box.innerHTML = '<div class="empty">还没有更新记录</div>';
  else box.innerHTML = list.map(c => `
    <div class="item">
      <div class="top">
        <div>
          <div class="name">${esc(c.versionName || "(未填版本)")}</div>
          <div class="meta">${esc(c.date || "")}</div>
        </div>
        <button class="btn-danger" data-del="${c.id}" style="padding:8px 14px;font-size:13.5px">删除</button>
      </div>
      <div style="margin-top:8px;color:var(--muted);font-size:13.5px;white-space:pre-wrap">${esc(c.highlights)}</div>
    </div>`).join("");
  box.onclick = async e => {
    const del = e.target.closest("[data-del]"); if (!del) return;
    if (!confirm("确定删除这条更新记录？")) return;
    try { await api("/changelog/records/" + del.dataset.del, { method:"DELETE" }); toast("已删除", "ok"); await refresh(); }
    catch(e){ toast(e.message, "err"); }
  };
  $("#add").onclick = async () => {
    const b = $("#add"); b.disabled = true; b.innerHTML = '<span class="spin"></span> 添加中…';
    try {
      const versionName = $("#cv").value.trim(), date = $("#cd").value.trim(), highlights = $("#ch").value.trim();
      if (!versionName) throw new Error("请填写版本号");
      await api("/changelog/records", { method:"POST", body: JSON.stringify({
        versionName, date: date || new Date().toISOString().slice(0,10), highlights, enabled: true })});
      toast("已添加", "ok"); await refresh();
    } catch(e){ toast(e.message, "err"); b.disabled = false; b.textContent = "添 加"; }
  };
}

/* ---------- 数据读写 ---------- */
async function upsert(coll, id, body){
  if (id) return api("/" + coll + "/records/" + id, { method:"PATCH", body: JSON.stringify(body) });
  return api("/" + coll + "/records", { method:"POST", body: JSON.stringify(body) });
}
async function load(){
  const [c, r, n, g] = await Promise.all([
    api("/control/records?perPage=1").catch(()=>({items:[]})),
    // [DFW-106] 必须和 App 用**完全一样**的查询：否则控制台显示的"当前版本"
    // 和用户真正拿到的那一条可能不是同一条（release 的 id 是随机的，排序≠创建时间）。
    api("/release/records?perPage=1&sort=-id").catch(()=>({items:[]})),
    api("/notice/records?perPage=200&sort=-id").catch(()=>({items:[]})),
    api("/changelog/records?perPage=200&sort=-id").catch(()=>({items:[]}))
  ]);
  cache.control = (c.items && c.items[0]) || null;
  cache.release = (r.items && r.items[0]) || null;
  cache.notice = (n.items || []);
  cache.changelog = (g.items || []);
  await loadHistory(cache.histPage);
}

/**
 * 写操作完成后调用：重新拉数据**并重绘当前页**。
 *
 * 只 `await load()` 是不够的——那只是把数据放进 cache，界面不会自己变。
 * 第一版就因此出现"提示发布成功，但列表还是旧的"（请求全 200、无报错，很容易误判成后端问题）。
 */
async function refresh(){
  await load();
  renderPane();
}

/* ---------- 启动 ---------- */
async function boot(){
  if (!token) { renderLogin(); return; }
  $("#app").innerHTML = '<div class="empty" style="padding-top:22vh"><span class="spin"></span> 正在载入…</div>';
  try { await load(); }
  catch(e){ toast(e.message, "err"); renderLogin(); return; }
  renderShell();
}
boot();
</script>
