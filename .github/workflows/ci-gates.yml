# [DFWX] DFW-31 · CI 分层门禁
#
# 背景（审计 B-4）：本仓库原有的两个工作流**从不跑任何 test 任务**，
# 约 90+ 个测试类在 CI 上从未执行过；而历史上出现过"CI 冒烟绿灯但安全策略测试
# 在 checkout 后根本不存在"（untracked 的 DownloadPolicyTest）这类假绿。
#
# 本工作流把门禁分层，并**复用 `tools/ci-gate.sh`** —— 同一个脚本本地也能跑，
# 这是卡片验收「本地与 CI 结论可对照」的实现方式（两套命令必然对不上）。
#
# 分层设计：
#   docs  → 静态检查（秒级）：文档一致性、仓库卫生、清单明文开关。任何 push/PR 都跑。
#   unit  → JVM 测试（数分钟）：host + vendor + common 三套。任何 push/PR 都跑。
#   lint  → Android Lint（数分钟）：emptyRelease 变体，0 error [DFW-123]。任何 push/PR 都跑。
#   apk   → release 构建门禁（十几分钟）：unsigned 构建 + ABI + 权限 + 清单开关断言。
#
# 依赖链：docs → {unit, lint} → apk
#   `lint` 刻意只 `needs: docs`（而不是 `needs: unit`），这样它与 `unit` **并发**跑，
#   耗时可完全藏在 `unit` 后面；`apk` 仍只等 `unit`，关键路径**不加长**。
#   [DFW-123] lint 报的是权限/API 版本/受限 API 这类"编译能过、运行时才炸"的问题，
#   按 PR 跑才有意义；只在 push 上跑会放过 PR 阶段。
#
# 隐私与红线：
#   · 本工作流**不接触任何签名材料**（CI 无 keystore），只做 unsigned 构建与断言；
#   · 不自动发布、不创建 Release、不改版本号；
#   · 正式对用户分发的签名包仍走本地构建流程（见技能 dfwx-release）。

name: ci-gates

on:
  push:
    branches: [test, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 第一层：静态门禁（快，先挡住最容易出错的文档/配置漂移） ----------
  docs:
    name: 静态门禁（文档 / 卫生 / 清单开关）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run docs gate
        run: |
          chmod +x gradlew tools/ci-gate.sh
          JAVA_HOME="${JAVA_HOME:-}" tools/ci-gate.sh docs

  # ---------- 第二层：JVM 测试（三套：host / vendor / common） ----------
  unit:
    name: JVM 测试门禁（host + vendor + common）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK (platform 37 / build-tools 37.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Run unit gate
        run: |
          chmod +x gradlew tools/ci-gate.sh
          tools/ci-gate.sh unit

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            rikkahub/app/build/reports/tests/**
            rikkahub/common/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # ---------- 第三层：Android Lint（与 unit 并发；0 error 才算过）[DFW-123] ----------
  #
  # 为什么独立成 job 而不是塞进 unit：
  #   lint 跑的是 **emptyRelease** 变体，测试跑的是 **emptyDebug** 变体，两者**不共享编译产物**；
  #   混在 unit 里会让"红的是测试还是静态检查"变模糊。
  # 为什么 `needs: docs` 而不是 `needs: unit`：这样它与 unit 并发，不落在关键路径上。
  lint:
    name: Lint 门禁（emptyRelease，0 error）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK (platform 37 / build-tools 37.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      # [2026-10-05 修复] 必须声明 unsigned：lintEmptyRelease 任务名带 "Release"，
      # 会撞上 app/build.gradle.kts 的 DFWX-SEC-003 签名门禁，而 CI 上没有 keystore。
      # 缺这一行 = 每次推送 lint 必红（此前连续多次失败就是这个原因）。
      - name: Run lint gate
        env:
          DFWX_UNSIGNED: '1'
        run: |
          chmod +x gradlew tools/ci-gate.sh
          tools/ci-gate.sh lint

      # lint 报告是排查的全部依据；失败时一定要传上去，否则只有一行"有 N 条 error"。
      - name: Upload lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ---------- 第四层：release 产物门禁（unsigned；断言 ABI/权限/清单/版本） ----------
  apk:
    name: release 产物门禁（unsigned + ABI/权限/清单断言）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: unit
    # 产物门禁只在 test/main 分支上跑，避免每个 PR 都烧十几分钟
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK (platform 37 / build-tools 37.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Run APK gate (unsigned, no keystore in CI)
        env:
          DFWX_UNSIGNED: '1'
        run: |
          chmod +x gradlew tools/ci-gate.sh
          tools/ci-gate.sh apk

      # [DFWX DFW-52] 防"unsigned 包被误当发布物"：
      # CI 产出的 release 包**没有签名**，绝不能分发。这里做两件事——
      #  1) 把文件改名成带 UNSIGNED-DO-NOT-DISTRIBUTE 的名字；
      #  2) 往包里塞一份同名的说明文本，让拿到产物的人第一眼就知道它不是发布件。
      # 真正的发布包只由本地 `tools/release.sh` 构建并核对（见 DFW-32）。
      - name: Mark unsigned artifact as non-distributable
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/empty/release/*.apk | head -1)
          OUT_DIR=dist-unsigned
          mkdir -p "$OUT_DIR"
          cp "$SRC" "$OUT_DIR/dongfang-wuxian-UNSIGNED-DO-NOT-DISTRIBUTE.apk"
          cat > "$OUT_DIR/README-请勿分发.txt" <<'TXT'
          本目录中的 APK 是 CI 构建的 **未签名** 产物，仅用于自动化断言
          （ABI / 权限 / 清单开关检查），**不是发布件、不可分发**。

          对用户发布的签名包只来自本地发版流程：
            tools/release.sh verify   # 发版前门禁
            tools/release.sh build    # 构建 + aapt 断言 + 归档
            tools/release.sh publish  # 上传并三步核对（默认 dry-run）

          正式下载页：https://github.com/dongwangxingchen/dongfang-wuxian/releases
          TXT
          ls -la "$OUT_DIR"

      - name: Upload unsigned APK (clearly named as non-distributable)
        uses: actions/upload-artifact@v4
        with:
          name: dongfang-wuxian-UNSIGNED-do-not-distribute
          path: dist-unsigned/**
          retention-days: 7
          if-no-files-found: error
